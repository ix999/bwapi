# Builds the replay viewer APK.
#
# GitHub-hosted runners ship the Android SDK and NDK preinstalled, so this
# works without any network-policy changes on a developer machine or a
# sandboxed agent environment. The APK is uploaded as a build artifact.
name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'tools/native-test/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/native-test/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Needed to publish the rolling release below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # SDL2 and openbw are submodules; without them the CMake configure
          # step fails with an explicit "run git submodule update" message.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle validates every wrapper jar in the repository by default,
      # which trips over the sample project vendored inside the SDL submodule.
      # That wrapper is never executed here, so validate ours explicitly
      # instead of either trusting a third-party jar or dropping the check.
      - name: Verify the Gradle wrapper we execute
        run: |
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check --strict

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # The runner ships the SDK but does not put cmdline-tools on PATH.
      # Versions here must match ndkVersion and the cmake version pinned in
      # android/app/build.gradle.kts.
      - name: Install pinned NDK and CMake
        run: |
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "sdkmanager not found at $sdkmanager" >&2
            ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" >&2 || true
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: openbw-replays-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts are zipped and need a signed-in browser, which makes
      # installing on a phone awkward. A release asset is a plain, permanent,
      # one-tap URL instead:
      #
      #   https://github.com/<owner>/<repo>/releases/download/debug-latest/openbw-replays-debug.apk
      #
      # The tag is replaced on every build, so that URL always serves the newest
      # APK. This is a debug build signed with the standard debug key, and the
      # repository is public, so treat the download as public too.
      - name: Publish rolling debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(ls android/app/build/outputs/apk/debug/*.apk | head -1)"
          cp "$apk" openbw-replays-debug.apk

          # Replace rather than update: a rolling tag should not accumulate
          # assets from previous builds.
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest openbw-replays-debug.apk \
            --title "Latest debug build" \
            --notes "Automatic build of ${GITHUB_SHA}. Debug-signed; sideload only." \
            --prerelease

  # The engine core is platform independent, so it is compiled and exercised
  # without any Android toolchain. Playback against real game data needs the
  # copyrighted mpqs, which are not available here, so this covers compilation
  # and the missing-data error path only.
  native-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev

      - name: Build desktop harness
        run: |
          cmake -S tools/native-test -B build-native \
            -DOPENBW_DIR=android/third_party/openbw \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native -j"$(nproc)"

      - name: Check the missing-data error path
        run: |
          set +e
          out=$(SDL_VIDEODRIVER=dummy ./build-native/bwreplay-native-test /nonexistent /nonexistent/x.rep 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then echo "expected a non-zero exit"; exit 1; fi
          echo "$out" | grep -q "Patch_rt.mpq" || { echo "expected a missing-mpq message"; exit 1; }
